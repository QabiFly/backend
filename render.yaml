services:
  # Backend Service
  - type: web
    name: saleor-backend
    runtime: python
    plan: free
    buildCommand: "pip install -e . && python manage.py collectstatic --noinput"
    startCommand: "uvicorn saleor.asgi:application --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: saleor-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: saleor-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: saleor-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: saleor-backend.onrender.com
      - key: DEBUG
        value: false
      - key: PLATFORM_NAME
        value: saleor
      - key: PLATFORM_TAGLINE
        value: Apna Gaon, Apna Bazaar
      - key: COMPANY_NAME
        value: ZEAIPC
      - key: BRAND_NAME
        value: QalbConverfy
      - key: LOCATION_CITY
        value: Reoti
      - key: LOCATION_DISTRICT
        value: Ballia
      - key: LOCATION_STATE
        value: Uttar Pradesh
      - key: DEFAULT_LAT
        value: 26.0524
      - key: DEFAULT_LON
        value: 84.1837
      - key: DELIVERY_RADIUS_KM
        value: 2.0
      - key: MIN_ORDER_FREE_DELIVERY
        value: 50
      - key: PLATFORM_COMMISSION
        value: 5
      - key: DELIVERY_COMMISSION
        value: 3
      - key: UDHAAR_DEFAULT_LIMIT
        value: 20000
      - key: OTP_EXPIRE_MINUTES
        value: 10
      - key: OTP_RESEND_SECONDS
        value: 30
      - key: GUEST_TOKEN_EXPIRE_HOURS
        value: 24
      - key: DEFAULT_FROM_EMAIL
        value: noreply@saleor.in
      - key: ENABLE_DEBUG_TOOLBAR
        value: false
      - key: GRAPHQL_PAGINATION_LIMIT
        value: 100
      - key: HTTP_IP_FILTER_ALLOW_LOOPBACK_IPS
        value: true
      - key: HTTP_IP_FILTER_ENABLED
        value: true
      - key: INTERNAL_IPS
        value: 127.0.0.1
      - key: LANGUAGE_CODE
        value: en
      - key: MAX_CHECKOUT_LINE_QUANTITY
        value: 50

  # Dashboard Service
  - type: web
    name: saleor-dashboard
    runtime: node
    plan: free
    buildCommand: "pnpm install && pnpm run build"
    startCommand: "pnpm run start"
    envVars:
      - key: API_URL
        value: https://saleor-backend.onrender.com/graphql/
      - key: APP_MOUNT_URI
        value: /dashboard/
      - key: STATIC_URL
        value: /dashboard/static/
      - key: ENVIRONMENT
        value: production
      - key: NODE_ENV
        value: production
      - key: FLAGS_SERVICE_ENABLED
        value: false
      - key: FF_USE_STAGING_SCHEMA
        value: false
      - key: LOCALE_CODE
        value: en-US
      - key: SW_INTERVAL
        value: 3600000
      - key: IS_CLOUD_INSTANCE
        value: false
      - key: ENABLED_SERVICE_NAME_HEADER
        value: false

  # Storefront Service
  - type: web
    name: saleor-storefront
    runtime: node
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://saleor-backend.onrender.com/graphql/
      - key: NEXT_PUBLIC_CHANNEL_SLUG
        value: default-channel
      - key: NEXT_PUBLIC_APP_MOUNT_URI
        value: /dashboard/
      - key: NEXT_PUBLIC_SITE_URL
        value: https://saleor-storefront.onrender.com
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

databases:
  - name: saleor-db
    databaseName: saleor
    user: saleor
    plan: free

services:
  - type: redis
    name: saleor-redis
    plan: free
    ipAllowList: []
